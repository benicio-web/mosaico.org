<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Organograma — Igreja Mosaico</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0f1117;--bg2:#161b26;--bg3:#1e2535;--bg4:#252d3f;
  --border:#2d3650;--border2:#3d4f70;
  --text:#e8eaf2;--text2:#9ba3be;--text3:#6b7394;
  --accent:#4f6ef7;--accent2:#3a57e8;--glow:rgba(79,110,247,0.15);
  --green:#22c55e;--gbg:rgba(34,197,94,0.12);
  --amber:#f59e0b;--abg:rgba(245,158,11,0.12);
  --red:#ef4444;--rbg:rgba(239,68,68,0.12);
  --sb:360px;--r:10px;--rl:16px;
  --font:'DM Sans',sans-serif;--mono:'DM Mono',monospace;
}
*{-webkit-tap-highlight-color:rgba(79,110,247,.2)}
button,.node-card,.slot,.sb-pos-item,.toggle-btn,.btn{cursor:pointer;touch-action:manipulation;user-select:none;-webkit-user-select:none}
body{font-family:var(--font);background:var(--bg);color:var(--text);min-height:100vh}
#app{display:flex;flex-direction:column;height:100vh;overflow:hidden}
#main{display:flex;flex:1;overflow:hidden}
#cv{flex:1;overflow:auto;padding:2rem;cursor:grab;-webkit-overflow-scrolling:touch}
#cv.pan{cursor:grabbing}
#cv.sb-open{margin-right:var(--sb)}
#cr{display:inline-flex;flex-direction:column;align-items:center;min-width:100%;transform-origin:top left;transition:transform .2s}
header{display:flex;align-items:center;justify-content:space-between;padding:.85rem 1.5rem;background:var(--bg2);border-bottom:1px solid var(--border);flex-shrink:0;position:relative;z-index:10}
.logo{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:600}
.logo-icon{width:32px;height:32px;background:var(--accent);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:14px;color:#fff;font-weight:700;flex-shrink:0}
.hact{display:flex;gap:8px}
.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border-radius:8px;font-size:13px;font-weight:500;transition:all .15s;border:1px solid var(--border);background:var(--bg3);color:var(--text);font-family:var(--font)}
.btn:hover,.btn:active{background:var(--bg4)}
.btn-p{background:var(--accent);border-color:var(--accent);color:#fff}
.btn-p:hover,.btn-p:active{background:var(--accent2)}
.btn svg{width:15px;height:15px;flex-shrink:0}
.btn-sm{padding:5px 10px;font-size:12px}
.tbar{display:flex;align-items:center;gap:8px;padding:.65rem 1.5rem;background:var(--bg2);border-bottom:1px solid var(--border);flex-wrap:wrap;flex-shrink:0}
.sw{position:relative;flex:1;min-width:150px;max-width:260px}
.sw svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:14px;height:14px;color:var(--text3);pointer-events:none}
.si{width:100%;padding:7px 10px 7px 32px;border-radius:8px;border:1px solid var(--border);background:var(--bg3);color:var(--text);font-size:13px;font-family:var(--font);outline:none}
.si:focus{border-color:var(--accent)}
.sbar{display:grid;grid-template-columns:repeat(5,1fr);border-bottom:1px solid var(--border);flex-shrink:0}
.sc{padding:.75rem 1rem;border-right:1px solid var(--border);text-align:center}
.sc:last-child{border-right:none}
.sn{font-size:20px;font-weight:600}
.sl{font-size:10px;color:var(--text3);margin-top:2px}
.tb{display:flex;flex-direction:column;align-items:center;position:relative}
.tc{display:flex;gap:18px;padding-top:20px;position:relative;justify-content:center}
.tc::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:var(--border2)}
.tc>.tb::before{content:'';position:absolute;top:-20px;left:50%;transform:translateX(-50%);height:20px;width:1px;background:var(--border2)}
.tcd{width:1px;height:20px;background:var(--border2)}
.nc{position:relative;width:190px;border-radius:var(--r);border:1px solid var(--border);background:var(--bg2);cursor:pointer;transition:all .2s;flex-shrink:0}
.nc:hover,.nc:active,.nc.act{border-color:var(--accent);box-shadow:0 0 0 3px var(--glow)}
.nc.act{background:var(--bg3)}
.nc.rn{width:250px}
.nc.wn{width:210px;border-color:var(--border2)}
.nhb{height:3px;border-radius:var(--r) var(--r) 0 0}
.hg .nhb{background:var(--green)}
.ha .nhb{background:var(--amber)}
.hr .nhb{background:var(--red)}
.nh{display:flex;align-items:flex-start;justify-content:space-between;padding:10px 12px 8px}
.nt{font-size:12px;font-weight:600;line-height:1.3}
.nl{font-size:10px;color:var(--text2);margin-top:2px}
.ntag{font-size:8px;font-weight:600;text-transform:uppercase;letter-spacing:.07em;padding:2px 6px;border-radius:4px;margin-top:4px;display:inline-block}
.te{background:rgba(79,110,247,.15);color:#7b9bfa}
.tm{background:rgba(34,197,94,.12);color:#4ade80}
.tc2{background:rgba(245,158,11,.12);color:#fbbf24}
.hbd{width:16px;height:16px;border-radius:50%;flex-shrink:0;margin-top:2px}
.hg .hbd{background:var(--gbg);box-shadow:0 0 0 1px var(--green)}
.ha .hbd{background:var(--abg);box-shadow:0 0 0 1px var(--amber)}
.hr .hbd{background:var(--rbg);box-shadow:0 0 0 1px var(--red)}
.nb{padding:0 12px 10px;border-top:1px solid var(--border)}
.slw{display:flex;gap:4px;flex-wrap:wrap;margin-top:8px}
.slot{width:18px;height:18px;border-radius:4px;border:1.5px solid var(--border2);cursor:pointer;transition:all .15s;flex-shrink:0}
.slot:hover,.slot:active{transform:scale(1.15)}
.slot.fi{background:var(--accent);border-color:var(--accent)}
.slot.va{border-style:dashed;border-color:var(--text3)}
.sll{font-size:10px;color:var(--text3);margin-top:5px}
.nf{display:flex;align-items:center;justify-content:flex-end;padding:5px 10px;border-top:1px solid var(--border)}
.tbtn{width:28px;height:28px;border-radius:6px;background:var(--bg3);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .15s;font-size:11px;color:var(--text2)}
.tbtn:hover,.tbtn:active{background:var(--bg4)}
/* SIDEBAR */
#sb{position:fixed;top:0;right:0;bottom:0;width:var(--sb);background:var(--bg2);border-left:1px solid var(--border);display:flex;flex-direction:column;transform:translateX(100%);transition:transform .3s cubic-bezier(.4,0,.2,1);z-index:150;overflow:hidden}
#sb.open{transform:translateX(0)}
.sbc{display:flex;align-items:center;gap:4px;padding:.65rem 1rem;border-bottom:1px solid var(--border);flex-wrap:wrap;flex-shrink:0}
.sbc-item{font-size:11px;color:var(--text3);cursor:pointer;padding:2px 6px;border-radius:4px;transition:all .1s;white-space:nowrap}
.sbc-item:hover{color:var(--text);background:var(--bg3)}
.sbc-item.cur{color:var(--text);font-weight:600;cursor:default}
.sbc-sep{font-size:11px;color:var(--text3)}
.sbh{padding:.9rem 1rem .5rem;border-bottom:1px solid var(--border);flex-shrink:0}
.sbt-row{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.sbt{font-size:15px;font-weight:600;flex:1}
.sbcl{width:28px;height:28px;border-radius:6px;border:1px solid var(--border);background:var(--bg3);cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--text2);font-size:15px;flex-shrink:0;transition:all .15s}
.sbcl:hover,.sbcl:active{background:var(--bg4)}
.sbl{font-size:12px;color:var(--text2);margin-top:4px}
.sbhr{display:flex;align-items:center;gap:8px;margin-top:6px}
.sbhd{width:10px;height:10px;border-radius:50%}
.hg .sbhd{background:var(--green)}
.ha .sbhd{background:var(--amber)}
.hr .sbhd{background:var(--red)}
.sbhl{font-size:11px;color:var(--text3)}
.sb-tabs{display:flex;flex-wrap:wrap;border-bottom:1px solid var(--border);flex-shrink:0}
.sbtab{padding:.5rem .75rem;font-size:12px;font-weight:500;color:var(--text3);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap;transition:all .15s;font-family:var(--font);background:transparent;border-top:none;border-left:none;border-right:none}
.sbtab:hover,.sbtab:active{color:var(--text)}
.sbtab.act{color:var(--accent);border-bottom-color:var(--accent)}
.sbb{flex:1;overflow-y:auto;padding:1rem;min-height:0}
.sbb::-webkit-scrollbar{width:4px}
.sbb::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px}
.sec{margin-bottom:1.25rem}
.sec-lbl{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.09em;color:var(--text3);margin-bottom:.6rem;display:block}
.ps-list{display:flex;flex-direction:column;gap:6px}
.ps-item{padding:8px 10px;background:var(--bg3);border:1px solid var(--border);border-radius:8px;cursor:pointer;transition:all .15s}
.ps-item:hover,.ps-item:active{border-color:var(--accent);background:var(--glow)}
.ps-item.fi{border-color:rgba(79,110,247,.4)}
.ps-name{font-size:13px;font-weight:500}
.ps-meta{display:flex;align-items:center;gap:8px;margin-top:3px}
.ps-st{font-size:10px;color:var(--text3)}
.ps-st.fi{color:var(--accent)}
.vl-list{display:flex;flex-direction:column;gap:6px}
.vl-item{display:flex;align-items:center;gap:8px;padding:6px 10px;background:var(--bg3);border:1px solid var(--border);border-radius:8px}
.vl-av{width:26px;height:26px;border-radius:50%;background:var(--glow);border:1px solid var(--accent);display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:var(--accent);flex-shrink:0}
.vl-name{font-size:13px;flex:1}
.vl-pos{font-size:10px;color:var(--text3)}
.act-item{font-size:13px;color:var(--text2);padding:5px 0;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px}
.act-item::before{content:'';width:6px;height:6px;border-radius:50%;background:var(--accent);flex-shrink:0}
.act-item:last-child{border-bottom:none}
.tag-row{display:flex;gap:6px;flex-wrap:wrap}
.tag{padding:3px 10px;border-radius:20px;font-size:11px;background:var(--bg3);border:1px solid var(--border);color:var(--text2)}
.proc-list{display:flex;flex-direction:column;gap:6px}
.proc-step{display:flex;align-items:flex-start;gap:8px;padding:8px 10px;background:var(--bg3);border:1px solid var(--border);border-radius:8px}
.ps-num{width:20px;height:20px;border-radius:50%;background:var(--glow);border:1px solid var(--accent);color:var(--accent);font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px}
.ps-cnt{flex:1}
.ps-ttl{font-size:13px;font-weight:500}
.ps-dsc{font-size:11px;color:var(--text3);margin-top:3px;line-height:1.5}
.ps-rsp{font-size:10px;color:var(--accent);margin-top:4px}
.ps-acts{display:flex;gap:4px;margin-left:auto;flex-shrink:0}
.ps-btn{width:24px;height:24px;border-radius:4px;border:1px solid var(--border);background:transparent;color:var(--text3);cursor:pointer;font-size:12px;display:flex;align-items:center;justify-content:center}
.ps-btn:hover,.ps-btn:active{background:var(--bg4);color:var(--text)}
.add-proc{background:var(--bg3);border:1px solid var(--border);border-radius:8px;padding:10px;margin-top:10px}
.fi-inp,.fi-ta,.fi-sel{width:100%;padding:7px 10px;border-radius:7px;border:1px solid var(--border);background:var(--bg2);color:var(--text);font-size:13px;font-family:var(--font);outline:none;transition:border .15s;margin-bottom:6px}
.fi-inp:focus,.fi-ta:focus,.fi-sel:focus{border-color:var(--accent)}
.fi-ta{resize:vertical;min-height:65px}
.fi-sel option{background:var(--bg2)}
.fr{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
/* MODALS */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:300;display:flex;align-items:center;justify-content:center;padding:1rem;backdrop-filter:blur(4px)}
.mo{background:var(--bg2);border:1px solid var(--border);border-radius:var(--rl);width:100%;max-width:540px;max-height:90vh;overflow-y:auto;animation:su .2s ease}
.mo-lg{max-width:620px}
@keyframes su{from{transform:translateY(20px);opacity:0}to{transform:translateY(0);opacity:1}}
.mh{display:flex;align-items:center;justify-content:space-between;padding:1rem 1.4rem;border-bottom:1px solid var(--border)}
.mt{font-size:15px;font-weight:600}
.ms{font-size:11px;color:var(--text3);margin-top:2px}
.mcl{width:28px;height:28px;border-radius:6px;border:1px solid var(--border);background:var(--bg3);cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--text2);font-size:15px;transition:all .15s}
.mcl:hover,.mcl:active{background:var(--bg4)}
.mb{padding:1rem 1.4rem}
.msec{margin-bottom:1rem}
.msec:last-child{margin-bottom:0}
.mlbl{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--text3);margin-bottom:.45rem;display:block}
.mf{display:flex;gap:8px;justify-content:flex-end;padding:.85rem 1.4rem;border-top:1px solid var(--border);flex-wrap:wrap}
.f-grp{margin-bottom:.85rem}
.f-lbl{display:block;font-size:12px;font-weight:500;color:var(--text2);margin-bottom:4px}
.f-inp,.f-ta,.f-sel{width:100%;padding:7px 11px;border-radius:8px;border:1px solid var(--border);background:var(--bg3);color:var(--text);font-size:13px;font-family:var(--font);outline:none;transition:border .15s}
.f-inp:focus,.f-ta:focus,.f-sel:focus{border-color:var(--accent)}
.f-ta{resize:vertical;min-height:70px}
.f-sel option{background:var(--bg3)}
.f-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.popt{display:flex;flex-direction:column;gap:7px;padding:.6rem 0}
.popt label{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:8px;border:1px solid var(--border);cursor:pointer;font-size:13px;transition:all .15s}
.popt label:hover{border-color:var(--border2);background:var(--bg3)}
.popt input[type=radio]{accent-color:var(--accent);width:14px;height:14px}
/* ZOOM */
.zc{position:fixed;bottom:1.25rem;right:1.25rem;display:flex;flex-direction:column;gap:4px;z-index:50}
.zb{width:36px;height:36px;border-radius:8px;border:1px solid var(--border);background:var(--bg2);color:var(--text);font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.zb:hover,.zb:active{background:var(--bg3)}
.zl{font-size:10px;color:var(--text3);text-align:center;font-family:var(--mono)}
/* PRINT */
@media print{
  header,.tbar,.sbar,.zc,#sb,.ov{display:none!important}
  #app{height:auto;overflow:visible}#main{overflow:visible}
  #cv{overflow:visible!important;padding:0!important;margin-right:0!important}
  #cr{transform:none!important;min-width:auto!important}
  body{background:#fff!important;color:#000!important}
  .nc{background:#fff!important;border:1.5px solid #ccc!important;color:#000!important}
  .nt,.nl{color:#000!important}.sll{color:#666!important}
  .nh,.nb,.nf{border-color:#ddd!important}
  .tcd,.tc::before,.tc>.tb::before{background:#aaa!important}
  .hg .nhb{background:#16a34a!important}.ha .nhb{background:#d97706!important}.hr .nhb{background:#dc2626!important}
  .tbtn,.hbd{display:none!important}
  .ph{display:block!important}
}
.ph{display:none;text-align:center;margin-bottom:1.5rem;padding-bottom:1rem;border-bottom:2px solid #000}
.ph h1{font-size:20px;font-weight:700;color:#000}.ph p{font-size:11px;color:#555;margin-top:3px}
/* MOBILE */
@media(max-width:700px){
  :root{--sb:100vw}
  header{padding:.65rem 1rem}.logo span{font-size:13px}
  .hact .btn span{display:none}.btn{padding:8px 10px;min-height:40px}
  .tbar{padding:.5rem 1rem}
  .sbar{grid-template-columns:repeat(3,1fr)}
  .sc:nth-child(3){border-right:none}.sc:nth-child(4){border-top:1px solid var(--border)}
  .sn{font-size:16px}
  .nc{width:130px}.nc.rn{width:155px}.nc.wn{width:142px}
  .nt{font-size:11px}.nl{font-size:10px}.ntag{font-size:8px}
  .tc{gap:8px}.tbtn{width:30px;height:30px;font-size:12px}.slot{width:20px;height:20px}
  #cv.sb-open{margin-right:0}
  .f-row{grid-template-columns:1fr}
  .ov{padding:.5rem;align-items:flex-end}.mo{border-radius:var(--rl) var(--rl) 0 0;max-height:88vh}
  .zb{width:40px;height:40px;font-size:19px}.zc{bottom:.75rem;right:.75rem}
}
/* CALENDAR GRID */
.cal-cell{min-height:70px;background:var(--bg3);border:1px solid var(--border);border-radius:6px;padding:4px;font-size:10px;vertical-align:top}
.cal-cell.cal-empty{background:transparent;border-color:transparent}
.cal-cell.cal-today{border-color:var(--accent);background:var(--glow)}
.cal-day-num{font-size:12px;font-weight:600;color:var(--text2);margin-bottom:3px;text-align:right}
.cal-today-num{color:var(--accent)}
.cal-ev{background:var(--accent);color:#fff;border-radius:3px;padding:1px 4px;margin-bottom:2px;font-size:9px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:default}
</style>
</head>
<body>
<div id="app">
<header>
  <div class="logo"><div class="logo-icon">M</div><span>Igreja Mosaico — Organograma</span></div>
  <div class="hact">
    <button class="btn" onclick="openPrint()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 01-2-2v-5a2 2 0 012-2h16a2 2 0 012 2v5a2 2 0 01-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg><span>Imprimir</span></button>
    <button class="btn" onclick="exportJSON()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg><span>JSON</span></button>
    <button class="btn btn-p" onclick="openAdd(null)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg><span>Novo</span></button>
  </div>
</header>
<div class="sbar" id="sbar"></div>
<div class="tbar">
  <div class="sw"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg><input class="si" id="q" placeholder="Buscar ministério, líder…" oninput="draw()"/></div>
  <button class="btn" onclick="expandAll()">Expandir tudo</button>
  <button class="btn" onclick="collapseAll()">Recolher tudo</button>
</div>
<div id="main">
  <div id="cv">
    <div class="ph"><h1>Igreja Mosaico — Organograma</h1><p id="pd"></p></div>
    <div id="cr"></div>
  </div>
  <div id="sb">
    <div class="sbc" id="sbc"></div>
    <div class="sbh" id="sbh"></div>
    <div class="sb-tabs" id="sbt"></div>
    <div class="sbb" id="sbb"></div>
  </div>
</div>
</div>
<div class="zc">
  <button class="zb" onclick="zm(0.1)">+</button>
  <div class="zl" id="zl">100%</div>
  <button class="zb" onclick="zm(-0.1)">−</button>
  <button class="zb" style="font-size:12px" onclick="zr()">⊡</button>
</div>
<!-- PRINT MODAL -->
<div class="ov" id="pm" style="display:none" onclick="cm('pm')">
<div class="mo" style="max-width:380px" onclick="event.stopPropagation()">
  <div class="mh"><div class="mt">Imprimir</div><button class="mcl" onclick="cm('pm')">✕</button></div>
  <div class="mb">
    <span class="mlbl">Formato</span><div class="popt"><label><input type="radio" name="pmd" value="n" checked/> Normal — múltiplas páginas</label><label><input type="radio" name="pmd" value="f"/> Página única — escala automática</label></div>
    <span class="mlbl" style="margin-top:1rem;display:block">Estado</span><div class="popt"><label><input type="radio" name="pst" value="c" checked/> Como está</label><label><input type="radio" name="pst" value="e"/> Expandir tudo antes</label></div>
  </div>
  <div class="mf"><button class="btn" onclick="cm('pm')">Cancelar</button><button class="btn btn-p" onclick="doPrint()">Imprimir</button></div>
</div></div>
<!-- POS VIEW MODAL -->
<div class="ov" id="pvm" style="display:none" onclick="cm('pvm')">

// ═══════════ UTILS ═══════════
function fn(t,id){if(t.id===id)return t;for(let c of(t.children||[])){const r=fn(c,id);if(r)return r;}return null;}
function rn(t,id){t.children=(t.children||[]).filter(c=>c.id!==id);for(let c of t.children)rn(c,id);}
function gp(t,id,p=[]){const np=[...p,{id:t.id,name:t.name}];if(t.id===id)return np;for(let c of(t.children||[])){const r=gp(c,id,np);if(r)return r;}return null;}
function gid(){return 'n'+Date.now().toString(36);}
function fmt(n){return n?'R$ '+Number(n).toLocaleString('pt-BR'):'—';}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function avols(){const s=new Set();function w(n){for(let p of(n.positions||[]))for(let v of(p.volunteers||[]))if(v.trim())s.add(v.trim());for(let c of(n.children||[]))w(c);}w(D);return s;}
function stats(){let m=0,tp=0,fp=0,bg=0;function w(n){m++;bg+=Number(n.budget)||0;for(let p of(n.positions||[])){tp++;if(p.filled)fp++;}for(let c of(n.children||[]))w(c);}w(D);return{m,tp,fp,bg,v:avols().size};}
function sm(n,q){if(!q)return true;const l=q.toLowerCase();return n.name.toLowerCase().includes(l)||(n.leader||'').toLowerCase().includes(l)||(n.activities||[]).some(a=>a.toLowerCase().includes(l));}
function nv(n,q){if(!q)return true;if(sm(n,q))return true;return(n.children||[]).some(c=>nv(c,q));}
// ═══════════ STATS BAR ═══════════
function drawStats(){
  const s=stats();const pct=s.tp?Math.round(s.fp/s.tp*100):0;
  const volPct=MEMBROS>0?Math.round(s.v/MEMBROS*100):null;
  document.getElementById('sbar').innerHTML=`
    <div class="sc"><div class="sn">${s.m}</div><div class="sl">Ministérios</div></div>
    <div class="sc"><div class="sn">${s.fp}/${s.tp}</div><div class="sl">Posições ocupadas</div></div>
    <div class="sc"><div class="sn">${s.v}</div><div class="sl">Voluntários únicos</div></div>
    <div class="sc" style="cursor:pointer" onclick="editMembros()" title="Clique para atualizar">
      <div class="sn">${MEMBROS||'—'}</div><div class="sl">Total de Membros ✎</div>
      ${volPct!==null?`<div style="font-size:10px;color:var(--accent);margin-top:2px">${volPct}% servindo</div>`:''}
    </div>
    <div class="sc"><div class="sn" style="font-size:15px">${fmt(s.bg)}</div><div class="sl">Orçamento/mês</div></div>`;
}
function editMembros(){
  const v=prompt('Total de membros da igreja:',MEMBROS||'');
  if(v===null)return;
  const n=parseInt(v);
  if(!isNaN(n)&&n>=0){MEMBROS=n;localStorage.setItem('mosaico_membros',n);}
  drawStats();
}

function draw(){
  const q=document.getElementById('q').value;
  const r=document.getElementById('cr');r.innerHTML='';
  r.appendChild(branch(D,q,true));
  drawStats();
}
function branch(n,q,root=false){
  const b=document.createElement('div');b.className='tb';
  b.appendChild(card(n,root));
  const ch=(n.children||[]).filter(c=>nv(c,q));
  if(ch.length&&!CS[n.id]){
    const d=document.createElement('div');d.className='tcd';b.appendChild(d);

function card(n,root){

function setTab(tab,el){

function renderSB(id,tab){

  ).join('')+'<span style="margin-left:auto"><button class="sbcl" onclick="closeSB()">✕</button></span>';

function getAllCalEvents(){
  const evs=[];
  function walk(n){
    (n.calEvents||[]).forEach(e=>evs.push({...e,ministry:n.name,ministryId:n.id}));
    (n.children||[]).forEach(c=>walk(c));
  }
  walk(D);
  return evs;
}

let CAL_VIEW_MONTH=new Date().getMonth();
let CAL_VIEW_YEAR=new Date().getFullYear();

function openCalView(){
  CAL_VIEW_MONTH=new Date().getMonth();
  CAL_VIEW_YEAR=new Date().getFullYear();
  document.getElementById('cal-ov').style.display='flex';
  renderCalView();
}

function renderCalView(){
  const evs=getAllCalEvents();
  const m=CAL_VIEW_MONTH, y=CAL_VIEW_YEAR;
  const firstDay=new Date(y,m,1).getDay();
  const daysInMonth=new Date(y,m+1,0).getDate();

  // events this month (by day)
  const byDay={};
  evs.forEach(e=>{
    if(e.month!==m)return;
    const day=e.day||0;
    if(!byDay[day])byDay[day]=[];
    byDay[day].push(e);
  });
  // recurring events (no specific day)
  const noDayEvs=(byDay[0]||[]);

  // build grid
  let cells='';
  // empty cells before first day
  for(let i=0;i<firstDay;i++) cells+=`<div class="cal-cell cal-empty"></div>`;
  // day cells
  for(let d=1;d<=daysInMonth;d++){
    const dayEvs=byDay[d]||[];
    const isToday=d===new Date().getDate()&&m===new Date().getMonth()&&y===new Date().getFullYear();
    cells+=`<div class="cal-cell${isToday?' cal-today':''}">
      <div class="cal-day-num${isToday?' cal-today-num':''}">${d}</div>
      ${dayEvs.slice(0,3).map(e=>`<div class="cal-ev" title="${esc(e.title)} — ${esc(e.ministry)}">${esc(e.title.length>14?e.title.slice(0,13)+'…':e.title)}</div>`).join('')}
      ${dayEvs.length>3?`<div style="font-size:9px;color:var(--text3);padding:1px 3px">+${dayEvs.length-3} mais</div>`:''}
    </div>`;
  }

  // events list for this month
  const allThisMonth=evs.filter(e=>e.month===m).sort((a,b)=>(a.day||0)-(b.day||0));
  const listRows=allThisMonth.length
    ? allThisMonth.map(e=>`
        <div style="display:flex;align-items:flex-start;gap:10px;padding:8px 10px;border-bottom:1px solid var(--border)">
          <div style="min-width:40px;text-align:center;flex-shrink:0">
            <div style="font-size:16px;font-weight:700;color:var(--text)">${e.day||'—'}</div>
            <div style="font-size:9px;color:var(--text3)">${e.wday!==undefined?WDAYS[e.wday]:''}</div>
          </div>
          <div style="flex:1">
            <div style="font-size:13px;font-weight:500">${esc(e.title)}</div>
            <div style="font-size:11px;color:var(--accent);margin-top:1px">${esc(e.ministry)}</div>
            ${e.desc?`<div style="font-size:11px;color:var(--text3);margin-top:2px">${esc(e.desc)}</div>`:''}
            ${e.resp?`<div style="font-size:10px;color:var(--text3);margin-top:2px">👤 ${esc(e.resp)}</div>`:''}
          </div>
          <div style="font-size:10px;color:var(--text3);flex-shrink:0">${e.recur?'🔁':'📌'}</div>
        </div>`).join('')
    : '<div style="padding:1rem;text-align:center;font-size:13px;color:var(--text3)">Nenhum evento neste mês.</div>';

  document.getElementById('cal-month-title').textContent=MONTHS[m]+' '+y;
  document.getElementById('cal-grid').innerHTML=cells;
  document.getElementById('cal-list').innerHTML=listRows;
}

function calNav(dir){
  CAL_VIEW_MONTH+=dir;
  if(CAL_VIEW_MONTH<0){CAL_VIEW_MONTH=11;CAL_VIEW_YEAR--;}
  if(CAL_VIEW_MONTH>11){CAL_VIEW_MONTH=0;CAL_VIEW_YEAR++;}
  renderCalView();
}

  document.getElementById('pe-fi').value=p.filled?'true':'false';
  document.getElementById('pe-jd').value=p.jd||'';
  document.getElementById('pe-sk').value=(p.skills||[]).join(', ');
  document.getElementById('pe-su').value=p.successor||'';
  document.getElementById('pe-hr').value=p.hours||'';
  const vl=document.getElementById('pe-vl');vl.innerHTML='';
  (p.volunteers||[]).forEach((v,i)=>{
    const row=document.createElement('div');row.style.cssText='display:flex;align-items:center;justify-content:space-between;padding:5px 8px;background:var(--bg3);border:1px solid var(--border);border-radius:7px;margin-bottom:5px';
    row.innerHTML='<span style="font-size:13px">'+esc(v)+'</span><button onclick="rmVol('+i+')" style="border:none;background:transparent;color:var(--text3);cursor:pointer;font-size:14px">✕</button>';
    vl.appendChild(row);
  });
  document.getElementById('pe-vi').value='';
  document.getElementById('pem').style.display='flex';
}
function rmVol(i){const n=fn(D,PREF.nid);n.positions[PREF.idx].volunteers.splice(i,1);openPE(PREF.nid,PREF.idx);}
function addVol(){
  const inp=document.getElementById('pe-vi');const v=inp.value.trim();if(!v)return;
  const p=fn(D,PREF.nid).positions[PREF.idx];
  if(!p.volunteers)p.volunteers=[];p.volunteers.push(v);inp.value='';openPE(PREF.nid,PREF.idx);
}
function savePE(){
  const nid=document.getElementById('pe-nid').value;
  const idx=parseInt(document.getElementById('pe-idx').value);
  const p=fn(D,nid).positions[idx];if(!p)return;
  p.name=document.getElementById('pe-nm').value.trim()||p.name;
  p.filled=document.getElementById('pe-fi').value==='true';
  p.jd=document.getElementById('pe-jd').value;
  p.skills=document.getElementById('pe-sk').value.split(',').map(s=>s.trim()).filter(Boolean);
  p.successor=document.getElementById('pe-su').value.trim();
  p.hours=Number(document.getElementById('pe-hr').value)||0;
  cm('pem');draw();if(SID)renderSB(SID,STAB);
}
// ═══════════ NODE EDIT MODAL ═══════════
function openAdd(pid){
  document.getElementById('net').textContent='Novo Ministério';
  ['ne-id','ne-par','ne-nm','ne-ld','ne-ac','ne-sk','ne-bg'].forEach(i=>document.getElementById(i).value='');
  document.getElementById('ne-par').value=pid||'';
  document.getElementById('ne-hl').value='green';document.getElementById('ne-tp').value='';
  document.getElementById('ne-pl').innerHTML='';
  document.getElementById('nem').style.display='flex';
}
function addPR(pos){
  const pl=document.getElementById('ne-pl');
  const row=document.createElement('div');row.style.cssText='display:flex;gap:5px;align-items:center';
  row.innerHTML='<input class="f-inp pn" style="flex:2" placeholder="Nome da posição" value="'+(pos?esc(pos.name):'')+'"/><select class="f-sel pf" style="flex:1"><option value="true" '+(pos&&pos.filled?'selected':'')+'>Ocupada</option><option value="false" '+(pos&&!pos.filled?'selected':'')+'>Vaga</option></select><button type="button" onclick="this.parentNode.remove()" style="padding:5px 8px;border-radius:7px;border:1px solid var(--border);background:var(--bg3);color:var(--red);cursor:pointer">✕</button>';
  pl.appendChild(row);
}
function saveNE(){
  const id=document.getElementById('ne-id').value;
  const pid=document.getElementById('ne-par').value;
  const nm=document.getElementById('ne-nm').value.trim();if(!nm){alert('Nome obrigatório');return;}
  const positions=[];
  document.getElementById('ne-pl').querySelectorAll('div').forEach(r=>{
    const n=r.querySelector('.pn')?.value.trim();if(!n)return;
    positions.push({name:n,filled:r.querySelector('.pf')?.value==='true',successor:'',jd:'',skills:[],volunteers:[],hours:0});
  });
  const obj={name:nm,leader:document.getElementById('ne-ld').value.trim(),health:document.getElementById('ne-hl').value,type:document.getElementById('ne-tp').value,budget:Number(document.getElementById('ne-bg').value)||0,activities:document.getElementById('ne-ac').value.split('\n').map(s=>s.trim()).filter(Boolean),skills:document.getElementById('ne-sk').value.split(',').map(s=>s.trim()).filter(Boolean),positions,processes:[],children:[]};
  if(id){const n=fn(D,id);if(n)Object.assign(n,obj);}
  else{obj.id=gid();if(pid){const par=fn(D,pid);if(par)par.children.push(obj);}else{D.children=D.children||[];D.children.push(obj);}}
  cm('nem');draw();
}
// ═══════════ PRINT ═══════════
function openPrint(){document.getElementById('pm').style.display='flex';}
function doPrint(){
  const mode=document.querySelector('input[name="pmd"]:checked').value;
  const state=document.querySelector('input[name="pst"]:checked').value;
  cm('pm');if(state==='e')expandAll();
  document.getElementById('pd').textContent='Impresso em '+new Date().toLocaleDateString('pt-BR',{day:'2-digit',month:'long',year:'numeric'});
  const cr=document.getElementById('cr');const prev=cr.style.transform;
  if(mode==='f'){const sc=Math.min(1,1050/cr.scrollWidth);cr.style.transform='scale('+sc+')';cr.style.transformOrigin='top center';}
  else{cr.style.transform='none';}
  setTimeout(()=>{window.print();setTimeout(()=>{cr.style.transform=prev;},300);},300);
}
// ═══════════ HELPERS ═══════════
function cm(id){document.getElementById(id).style.display='none';}
function expandAll(){CS={};draw();}
function collapseAll(){
  function m(n,d){if(d>=4)CS[n.id]=true;(n.children||[]).forEach(c=>m(c,d+1));}
  m(D,1);draw();
  setTimeout(()=>{
    const cr=document.getElementById('cr'),cv=document.getElementById('cv');
    const sc=Math.min(1,(cv.clientWidth-64)/cr.scrollWidth,(cv.clientHeight-64)/cr.scrollHeight);
    ZL=Math.round(sc*10)/10||0.5;
    cr.style.transform='scale('+ZL+')';document.getElementById('zl').textContent=Math.round(ZL*100)+'%';
  },150);
}
function exportJSON(){
  const b=new Blob([JSON.stringify(D,null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='organograma-mosaico.json';a.click();
}
function zm(d){ZL=Math.min(2,Math.max(0.2,ZL+d));document.getElementById('cr').style.transform='scale('+ZL+')';document.getElementById('zl').textContent=Math.round(ZL*100)+'%';}
function zr(){ZL=1;zm(0);}
// ═══════════ PAN + TOUCH ═══════════
let _pan=false,_ps={x:0,y:0},_ss={x:0,y:0};
const _cv=document.getElementById('cv');
_cv.addEventListener('mousedown',e=>{if(e.target.closest('.nc')||e.target.closest('.btn')||e.target.closest('.tbtn')||e.target.closest('.slot'))return;_pan=true;_cv.classList.add('pan');_ps={x:e.clientX,y:e.clientY};_ss={x:_cv.scrollLeft,y:_cv.scrollTop};});
document.addEventListener('mousemove',e=>{if(!_pan)return;_cv.scrollLeft=_ss.x-(e.clientX-_ps.x);_cv.scrollTop=_ss.y-(e.clientY-_ps.y);});
document.addEventListener('mouseup',()=>{_pan=false;_cv.classList.remove('pan');});
let _td=null;
_cv.addEventListener('touchstart',e=>{if(e.touches.length===2){_td=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);e.preventDefault();}},{passive:false});
_cv.addEventListener('touchmove',e=>{if(e.touches.length===2&&_td!==null){const d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);ZL=Math.min(2,Math.max(0.2,ZL+(d-_td)*0.006));_td=d;document.getElementById('cr').style.transform='scale('+ZL+')';document.getElementById('zl').textContent=Math.round(ZL*100)+'%';e.preventDefault();}},{passive:false});
_cv.addEventListener('touchend',()=>{_td=null;},{passive:true});
function autofit(){
  if(window.innerWidth>768)return;
  setTimeout(()=>{
    const cr=document.getElementById('cr'),cv=document.getElementById('cv');
    cr.style.transform='scale(1)';
    const sc=Math.min(1,(cv.clientWidth-20)/cr.scrollWidth);
    ZL=Math.round(sc*10)/10||0.5;
    cr.style.transform='scale('+ZL+')';cr.style.transformOrigin='top left';
    document.getElementById('zl').textContent=Math.round(ZL*100)+'%';
  },300);
}
window.addEventListener('resize',autofit);
// ═══════════ INIT ═══════════
draw();
if(window.innerWidth<=768)collapseAll();else autofit();
</script>
